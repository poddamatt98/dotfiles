# ~/.config/tmux/tmux.conf

# --- Prefix -------------------------------------------------------------------

# Use C-a instead of C-b. Press C-a twice to send a literal C-a to the program.
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# --- General ------------------------------------------------------------------

set-option -g mouse on

# Number windows and panes from 1, to match the keyboard layout.
set-option -g base-index 1
set-option -g pane-base-index 1

# Don't let programs rename windows through escape sequences.
set-option -g allow-rename off

# --- Key bindings -------------------------------------------------------------

# prefix r: reload this file.
bind-key r source-file ~/.config/tmux/tmux.conf

# prefix f: fzf project picker (same script as Ctrl-f in zsh).
bind-key f run-shell "$HOME/.config/scripts/my_tmux.sh"

# prefix h/j/k/l: move between panes.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# prefix H/J/K/L: resize the pane by 3 cells. Repeatable without the prefix.
bind-key -r H resize-pane -L 3
bind-key -r J resize-pane -D 3
bind-key -r K resize-pane -U 3
bind-key -r L resize-pane -R 3

# --- Appearance ---------------------------------------------------------------

set-option -g status-position top

# Black pane background, matching ghostty. window-active-style inherits it.
set-option -g window-style "bg=#000000,fg=default"

# catppuccin options. Read when the plugin loads, so they go before TPM runs.
set-option -g @catppuccin_flavor 'mocha'
# Show the window name (the src/ subdir from my_tmux.sh) instead of the pane title.
set-option -g @catppuccin_window_text ' #W'
set-option -g @catppuccin_window_current_text ' #W'

# --- Plugins ------------------------------------------------------------------

# Managed by TPM: prefix I installs, prefix U updates.
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'catppuccin/tmux#v2.1.3' # tags: https://github.com/catppuccin/tmux/tags
# C-h/j/k/l moves across nvim splits and tmux panes (pairs with nvim/lua/plugins/tmux.lua).
set-option -g @plugin 'christoomey/vim-tmux-navigator'

# Clone TPM if missing, then install any plugin above that isn't installed yet.
# Installed plugins are skipped, so this only touches the network for new ones.
# install_plugins needs the plugin path, which TPM only sets once it runs.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
if-shell "test ! -d ~/.config/tmux/plugins/tpm" \
    "run-shell 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"
run-shell '~/.config/tmux/plugins/tpm/bin/install_plugins > /dev/null'

# Loads the plugins. Runs synchronously, so everything below sees them loaded.
run-shell '~/.config/tmux/plugins/tpm/tpm'

# --- After plugins ------------------------------------------------------------

# Settings catppuccin would otherwise overwrite when it loads.
set-option -g status-style "bg=#000000,fg=white"
set-option -g status-left ""
set-option -g status-right "#{E:@catppuccin_status_session}"
